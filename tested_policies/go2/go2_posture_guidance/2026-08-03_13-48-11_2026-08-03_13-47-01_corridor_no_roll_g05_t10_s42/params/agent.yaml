seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 5000
empirical_normalization: false
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: false
    data_augmentation_func: go2_posture.tasks.direct.go2_posture.symmetry:compute_symmetric_states
    mirror_loss_coeff: 0.0
  rnd_cfg: null
clip_actions: null
save_interval: 50
experiment_name: go2_coarse05_fixed10_s42
run_name: 2026-08-03_13-47-01_corridor_no_roll_g05_t10_s42
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: null
load_checkpoint_path: null
